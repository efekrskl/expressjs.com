on:
  schedule:
    - cron: '0 0 * * 0'
  pull_request:
    types: [ labeled ]

name: Check markdown links
jobs:
  my-broken-link-checker:
    if: |
      github.event_name != 'pull_request' ||
      github.event.label.name == 'link check'
    name: Check broken links
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Check for broken links
        uses: ruzickap/action-my-broken-link-checker@v2
        with:
          url: https://www.expressjs.com
          cmd_params: "--buffer-size=8192 --max-connections-per-host=1 --color=always --exclude=https://*.googleusercontent.com --exclude=https://*.gstatic.com --exclude=https://*.googlesyndication.com --exclude=https://*.adtrafficquality.google --exclude=https://*.google.com/ads/ --exclude=https://www.npmjs.org/"
