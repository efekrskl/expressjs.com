name: Check broken URLs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 1 * *'
  pull_request:
    types: [ labeled ]

permissions:
  contents: write
  pull-requests: write

jobs:
  check-urls:
    if: |
      github.event_name != 'pull_request' ||
      github.event.label.name == 'link check'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@ab177d40ee5483edb974554986f56b33477e21d0 # https://github.com/ruby/setup-ruby/releases/tag/v1.265.0
        with:
          bundler-cache: true
          cache-version: 0

      - name: Build with Jekyll
        run: bundle exec jekyll build

      - name: Check URLs
        continue-on-error: true
        shell: bash
        run: |
          docker run --rm -u $(id -u):$(id -g) -v "$PWD":/mnt ghcr.io/linkchecker/linkchecker:10.6.0 /mnt/_site/ \
          --file-output=failures/utf-8//mnt/failures.log \
          --timeout=10 \
          --ignore-url='^mailto:' \
          --recursion-level=5 \
          --check-extern

      - name: Format failures as checklist
        id: format
        run: |
          if [ ! -s failures.log ]; then
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_failures=true" >> "$GITHUB_OUTPUT"

          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "**Broken links checklist**\n(occurrence) (file) (target URL)" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"

          # Format to a checklist
          # (occurrences) (found in) (target URL)
          sed \
            -e 's#file:///mnt/_site/##g' \
            -e "s/[()'\"']//g" \
            -e 's/, / -> /g' \
            -e 's/^/ - [ ] /' \
            failures.log | head -n 100 >> "$GITHUB_OUTPUT"

          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Comment checklist on PR
        if: github.event_name == 'pull_request' && steps.format.outputs.has_failures == 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.format.outputs.body }}

      - name: Open/update monthly issue with checklist
        if: github.event_name != 'pull_request' && steps.format.outputs.has_failures == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Monthly broken link checklist – ${{ github.run_id }}"
          content-filepath: checklist.md
          labels: chore, docs, link check
