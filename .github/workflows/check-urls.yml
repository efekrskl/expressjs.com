on:
  schedule:
    - cron: '0 8 1 * *'
  pull_request:
    types: [ labeled ]

permissions:
  contents: read
  pull-requests: read

name: Check URLs
jobs:
  my-broken-link-checker:
    if: |
      github.event_name != 'pull_request' ||
      github.event.label.name == 'link check'
    runs-on: ubuntu-latest

    steps:
      - name: Run broken link checker
        shell: bash
        run: |
          docker run --rm raviqqe/muffet:latest \
            --buffer-size=65536 \
            --max-connections-per-host=1 \
            --timeout=10 \
            --color=always \
            --ignore-fragments \
            --accepted-status-codes=200..300,403,429 \
            --exclude "(^https?://(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])(:[0-9]+)?(/|$)|googleusercontent\.com|gstatic\.com|googlesyndication\.com|adtrafficquality\.google|google\.com|npmjs\.(org|com)|twitter\.com|x\.com|t\.co)"
            https://www.expressjs.com \
            2>&1 | grep -vE 'https?://([a-z0-9-]+\.)?expressjs\.com(/|$)' \
            | awk '!seen[$0]++' || true
