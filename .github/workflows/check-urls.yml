on:
  schedule:
    - cron: '0 8 1 * *'
  pull_request:
    types: [ labeled ]

permissions:
  contents: read
  issues: write
  pull-requests: read

name: Check markdown links
jobs:
  my-broken-link-checker:
    if: |
      github.event_name != 'pull_request' ||
      github.event.label.name == 'link check'
    name: Check broken links
    runs-on: ubuntu-latest

    steps:
      - name: Check for broken links
        uses: ruzickap/action-my-broken-link-checker@v2
        with:
          url: https://www.expressjs.com
          cmd_params: "--buffer-size=65536 --max-connections-per-host=1 --color=always --ignore-fragments --exclude=\"^https?://(?!([a-z0-9-]+\\.)?expressjs\\.com(/|$)).+\""
