name: Check links on expressjs.com

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 1 * *' # first of each month at 08:00 UTC
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  linkcheck:
    if: |
      github.event_name != 'pull_request' ||
      github.event.label.name == 'link check'
    runs-on: ubuntu-latest

    steps:
      - name: Check links on expressjs.com
        uses: filiph/linkcheck@3.0.0
        with:
          arguments: "https://expressjs.com"
