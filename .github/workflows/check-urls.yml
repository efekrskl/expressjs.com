on:
  schedule:
    - cron: '0 0 * * 0'
  pull_request:
    types: [ labeled ]

name: Check markdown links
jobs:
  my-broken-link-checker:
    if: |
      github.event_name != 'pull_request' ||
      github.event.label.name == 'link check'
    name: Check broken links
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Check for broken links
        uses: ruzickap/action-my-broken-link-checker@v2
        with:
          url: https://www.expressjs.com
          cmd_params: "--rate-limit=1 --buffer-size=65536 --max-connections-per-host=1 --color=always --ignore-fragments --exclude=\"(googleusercontent\\.com|gstatic\\.com|googlesyndication\\.com|adtrafficquality\\.google|google\\.com|npmjs\\.org|npmjs\\.com|registry\\.npmjs\\.org|docs\\.npmjs\\.com)\""
